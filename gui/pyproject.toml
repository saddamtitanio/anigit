[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anigit-gui"
version = "0.1.0"
description = "Desktop app for AniGit: version history for Krita animations"
requires-python = ">=3.9"
dependencies = ["PySide6>=6.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "ruff>=0.5"]

[project.scripts]
anigit = "anigit_gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]
